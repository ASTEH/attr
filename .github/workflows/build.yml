name: Build HUD customization

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out HUD overlay
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Fetch pinned Attract To Sound source
        run: |
          git clone https://github.com/Sylsatra/attract_to_sound.git upstream
          git -C upstream checkout beabac3bed5baee4a0f179b47965766824dc307b

      - name: Apply HUD overlay
        run: |
          cp -R overlay/src/main/java/. upstream/src/main/java/
          cp -R overlay/src/main/resources/. upstream/src/main/resources/

      - name: Build mod
        working-directory: upstream
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon build

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: attract-to-sound-hud-customization
          path: upstream/build/libs/*.jar
          if-no-files-found: error
